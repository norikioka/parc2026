[project]
name = "parc2026"
version = "0.1.0"
description = "PARC2026 (AIRoA x 東京大学松尾・岩澤研究室 Physical AI Robot Challenge 2026) 参加用リポジトリ"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
    "pandas",
    "torch",
    "pytest",
    # policy_server.py(提出物本体)がColab側で使う軽量依存。lerobot/GPU不要な部分だけを
    # ローカルで直接importしてテストできるようにするため(2026-08-04 criticレビューMAJOR#1対応)
    "fastapi",
    "uvicorn",
    "msgpack",
]

[dependency-groups]
dev = [
    "ruff",
    "jupyterlab",
    "ipykernel",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# vendor: HuggingFace lerobotをPython 3.10互換パッチして同梱したもの(サードパーティ)。
# 自分のコードではないため、lintの対象にしない。
extend-exclude = ["notebooks", "src/parc2026/vendor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parc2026"]
